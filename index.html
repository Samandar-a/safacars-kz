<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAFACARSKZ</title>

<style>
:root{
    --bg:#050505;
    --card:#121212;
    --border:#1f1f1f;
    --gold:#ffb800;
}

body{margin:0;font-family:-apple-system;background:var(--bg);color:#fff;}
.header{text-align:center;padding:20px;border-bottom:1px solid var(--border);}
.logo{font-size:24px;font-weight:900;}
.logo span{color:var(--gold);}
.container{padding:12px;}

input, select{
    width:100%;padding:12px;margin:6px 0;
    border-radius:10px;border:1px solid var(--border);
    background:#0f0f0f;color:#fff;
}

button{
    width:100%;padding:14px;border:none;border-radius:12px;
    background:linear-gradient(90deg,#ffb800,#ff8c00);
    font-weight:800;
}

.preview img{
    width:70px;height:70px;object-fit:cover;
    border-radius:8px;margin:4px;
}
</style>
</head>

<body>

<div class="header">
<div class="logo">SAFA<span>CARS</span>KZ</div>
</div>

<div class="container">

<!-- НОВАЯ ВКЛАДКА -->
<select id="type">
<option value="">Выберите тип</option>
<option>Фотосессия авто</option>
<option>Реклама авто</option>
</select>

<input id="auto" placeholder="Авто (марка + модель)">
<input id="year" placeholder="Год (4 цифры)">
<input id="price" placeholder="Цена">
<input id="city" value="Алматы" readonly>
<input id="engine" placeholder="Объем (например 2.0)">
<input id="mileage" placeholder="Пробег (км)">
<input id="phone" placeholder="+7 ___ ___ ____">

<input type="file" id="photos" accept="image/*" multiple>
<div class="preview" id="preview"></div>

<button onclick="sendToTelegram()">Отправить заявку</button>

</div>

<script>

/* ГОД */
year.oninput=e=>{
 e.target.value=e.target.value.replace(/\D/g,'').slice(0,4);
};

/* ЦЕНА */
price.oninput=e=>{
 let v=e.target.value.replace(/\D/g,'');
 e.target.value=v.replace(/\B(?=(\d{3})+(?!\d))/g," ");
};

/* ОБЪЕМ */
engine.oninput=e=>{
 e.target.value=e.target.value.replace(/[^0-9.]/g,'');
};

/* ПРОБЕГ */
mileage.oninput=e=>{
 e.target.value=e.target.value.replace(/\D/g,'');
};

/* ТЕЛЕФОН */
phone.oninput=e=>{
 let x=e.target.value.replace(/\D/g,'');
 if(!x.startsWith("7")) x="7"+x;

 let f="+7 ";
 if(x.length>1) f+=x.slice(1,4);
 if(x.length>=4) f+=" "+x.slice(4,7);
 if(x.length>=7) f+=" "+x.slice(7,11);

 e.target.value=f;
};

/* ФОТО */
photos.onchange=e=>{
 preview.innerHTML="";
 let files=[...e.target.files];

 if(files.length>20){
  alert("Максимум 20 фото");
  photos.value="";
  return;
 }

 files.forEach(f=>{
  let img=document.createElement("img");
  img.src=URL.createObjectURL(f);
  preview.appendChild(img);
 });
};

/* ОТПРАВКА В TELEGRAM */
function sendToTelegram(){

 let p = phone.value.replace(/\D/g,'');

 if(
  !type.value ||
  !auto.value ||
  year.value.length!==4 ||
  !price.value ||
  !engine.value ||
  !phone.value
 ){
  alert("Заполни все обязательные поля");
  return;
 }

 if(p.length!==11){
  alert("Неверный номер");
  return;
 }

 let text =
`🚗 SAFACARSKZ

Тип: ${type.value}
Авто: ${auto.value}
Год: ${year.value}
Цена: ${price.value}
Город: ${city.value}
Объем: ${engine.value}
Пробег: ${mileage.value || "не указан"}
Телефон: ${phone.value}

📸 Фото добавлены`;

 let url = "https://t.me/abdigapirov_s?text=" + encodeURIComponent(text);

 window.open(url, "_blank");
}

</script>

</body>
</html>
